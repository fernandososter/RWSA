<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo revisao - binario (tonic/phasic/any)</title>
<style>
  :root {
    --bg:#0f1720;
    --panel:#182430;
    --panel-2:#141f29;
    --ink:#e8eef4;
    --muted:#8aa0b4;
    --grid:#243444;
    --tonic:#4da3ff;
    --phasic:#c77dff;
    --any:#ffb347;
    --ok:#39d98a;
    --bad:#ff5d6c;
    --accent:#7fd4ff;
  }
  * { box-sizing:border-box; }
  html, body {
    height:100%;
  }
  body {
    margin:0;
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:linear-gradient(180deg, #0c131b 0%, var(--bg) 100%);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header {
    display:flex;
    gap:10px;
    align-items:center;
    padding:12px 16px;
    background:rgba(24, 36, 48, 0.96);
    border-bottom:1px solid var(--grid);
    flex-wrap:wrap;
  }
  header h1 { margin:0 10px 0 0; font-size:15px; font-weight:700; }
  select, button {
    font:inherit;
    color:var(--ink);
    background:#22303d;
    border:1px solid var(--grid);
    border-radius:8px;
    padding:7px 10px;
  }
  button { cursor:pointer; }
  button:hover, select:hover { border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .pill {
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 9px;
    border-radius:999px;
    background:#22303d;
    color:var(--muted);
    font-size:12px;
    border:1px solid transparent;
  }
  .pill strong { color:var(--ink); font-weight:600; }
  .pill.tonic { border-color:#4da3ff66; }
  .pill.phasic { border-color:#c77dff66; }
  .pill.any { border-color:#ffb34766; }
  .pill.version { border-color:#7fd4ff66; color:#d8f4ff; }
  .metarow {
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    width:100%;
  }
  main {
    display:grid;
    grid-template-columns:minmax(0, 1fr) 360px;
    flex:1;
    min-height:0;
  }
  #plotwrap { padding:14px 16px 18px; }
  #trace {
    width:100%;
    height:360px;
    background:#091119;
    border:1px solid var(--grid);
    border-radius:10px;
    display:block;
  }
  .legend, .summaryrow, .filters {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .legend { margin-top:10px; font-size:12px; color:var(--muted); }
  .legend span::before { content:"■ "; }
  .lg-tonic::before { color:var(--tonic); }
  .lg-phasic::before { color:var(--phasic); }
  .lg-any::before { color:var(--any); }
  .summaryrow { margin-top:12px; }
  .evinfo {
    margin-top:10px;
    padding:10px 12px;
    border-radius:10px;
    background:rgba(20, 31, 41, 0.9);
    border:1px solid var(--grid);
    color:var(--muted);
  }
  .evinfo b { color:var(--ink); }
  .navrow, .actions {
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .actions button { flex:1; min-width:140px; font-weight:700; }
  .btn-ok { background:var(--ok); color:#04120b; border-color:var(--ok); }
  .btn-bad { background:var(--bad); color:#210307; border-color:var(--bad); }
  aside {
    background:rgba(24, 36, 48, 0.98);
    border-left:1px solid var(--grid);
    padding:14px 12px 16px;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .paneltitle { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .filters { margin-top:8px; }
  .filters select { flex:1; min-width:140px; }
  .progress { margin-top:10px; color:var(--muted); font-size:12px; }
  .evlist { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  .evrow {
    display:grid;
    grid-template-columns:30px 1fr auto;
    gap:8px;
    align-items:center;
    padding:8px 9px;
    border-radius:8px;
    background:var(--panel-2);
    border:1px solid transparent;
    cursor:pointer;
  }
  .evrow:hover { border-color:var(--grid); }
  .evrow.active { border-color:var(--accent); background:#1a2835; }
  .lab {
    font-size:11px;
    padding:2px 7px;
    border-radius:999px;
    text-transform:lowercase;
    font-weight:700;
  }
  .lab.tonic { background:var(--tonic); color:#04121f; }
  .lab.phasic { background:var(--phasic); color:#1b0c27; }
  .lab.any { background:var(--any); color:#241800; }
  .dec {
    font-size:10px;
    padding:2px 6px;
    border-radius:999px;
    white-space:nowrap;
  }
  .dec.correto { background:#173a29; color:var(--ok); }
  .dec.incorreto { background:#3a1720; color:var(--bad); }
  .dec.pendente { background:#22303d; color:var(--muted); }
  .empty {
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    border:1px dashed var(--grid);
    color:var(--muted);
    background:rgba(20, 31, 41, 0.75);
  }
  .report {
    margin-top:16px;
    border-top:1px solid var(--grid);
    padding-top:12px;
  }
  table.acc {
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    margin-top:8px;
  }
  table.acc th, table.acc td {
    padding:5px 6px;
    border-bottom:1px solid var(--grid);
    text-align:left;
  }
  kbd {
    background:#22303d;
    border:1px solid var(--grid);
    border-bottom-width:2px;
    border-radius:4px;
    padding:1px 6px;
    font-size:11px;
  }
  @media (max-width: 1100px) {
    body { overflow:auto; }
    main { grid-template-columns:1fr; }
    aside {
      border-left:none;
      border-top:1px solid var(--grid);
      overflow:visible;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Modo revisao</h1>
  <select id="exam"></select>
  <span id="meta" class="pill">-</span>
  <span id="src" class="pill">-</span>
  <span id="viewver" class="pill version">__VIEW_REVISAO_VERSION__</span>
  <span style="flex:1"></span>
  <button id="reportbtn">Gerar relatorio</button>
  <div id="labelmeta" class="metarow"></div>
</header>
<main>
  <div id="plotwrap">
    <svg id="trace" viewBox="0 0 1280 360" preserveAspectRatio="none"></svg>
    <div class="legend">
      <span class="lg-tonic">tonic</span>
      <span class="lg-phasic">phasic</span>
      <span class="lg-any">any</span>
      <span>opacidade proporcional a cobertura</span>
    </div>
    <div id="quickstats" class="summaryrow"></div>
    <div id="evinfo" class="evinfo">Selecione um exame.</div>
    <div class="navrow">
      <button id="prev">&larr; Anterior <kbd>A</kbd></button>
      <button id="next">Proximo &rarr; <kbd>D</kbd></button>
      <span id="evpos" class="pill">-</span>
    </div>
    <div class="actions">
      <button class="btn-ok" id="btn-correto">Correto <kbd>C</kbd></button>
      <button class="btn-bad" id="btn-incorreto">Incorreto <kbd>X</kbd></button>
    </div>
    <div id="reportarea" class="report" hidden>
      <b>Relatorio de acuracia por tipo</b>
      <table class="acc" id="acctable"></table>
    </div>
  </div>
  <aside>
    <div class="paneltitle">Filtros</div>
    <div class="filters">
      <select id="filter-type">
        <option value="all">Todos os tipos</option>
        <option value="tonic">Somente tonic</option>
        <option value="phasic">Somente phasic</option>
        <option value="any">Somente any</option>
      </select>
      <select id="filter-decision">
        <option value="all">Todas as decisoes</option>
        <option value="pendente">Somente pendentes</option>
        <option value="correto">Somente corretos</option>
        <option value="incorreto">Somente incorretos</option>
      </select>
    </div>
    <div id="progress" class="progress">-</div>
    <div id="empty" class="empty" hidden>Nenhum evento para os filtros atuais.</div>
    <div id="evlist" class="evlist"></div>
  </aside>
</main>
<script>
const state = {
  exam: null,
  allEvents: [],
  events: [],
  idx: 0,
  labelMetadata: {},
  eventCounts: {},
  requestToken: 0,
};

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function shortPath(value) {
  if (!value) return null;
  const parts = String(value).split(/[\\/]/);
  return parts[parts.length - 1] || value;
}

function formatNumber(value, digits = 3) {
  if (value == null || Number.isNaN(Number(value))) return "-";
  return Number(value).toFixed(digits).replace(/\.?0+$/, "");
}

function quantile(values, q) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  const pos = (sorted.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  if (sorted[base + 1] === undefined) return sorted[base];
  return sorted[base] + rest * (sorted[base + 1] - sorted[base]);
}

function rgba(hex, alpha) {
  const clean = String(hex || "").replace("#", "");
  if (clean.length !== 6) return `rgba(255,255,255,${alpha})`;
  const r = parseInt(clean.slice(0, 2), 16);
  const g = parseInt(clean.slice(2, 4), 16);
  const b = parseInt(clean.slice(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

const SVG_NS = "http://www.w3.org/2000/svg";

function svgEl(name, attrs = {}) {
  const el = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) {
    if (value != null) el.setAttribute(key, String(value));
  }
  return el;
}

function decisionClass(decision) {
  if (decision === "correto") return "correto";
  if (decision === "incorreto") return "incorreto";
  return "pendente";
}

function buildMetaPills(meta) {
  const pills = [];
  if (meta?.rswa_source) pills.push(`rota: ${meta.rswa_source}`);
  const cov = meta?.coverage_thresholds || {};
  if (cov.tonic_min_coverage != null) pills.push(`cov tonic >= ${formatNumber(cov.tonic_min_coverage, 2)}`);
  if (cov.phasic_min_coverage != null) pills.push(`cov phasic >= ${formatNumber(cov.phasic_min_coverage, 2)}`);
  if (cov.any_min_coverage != null) pills.push(`cov any >= ${formatNumber(cov.any_min_coverage, 2)}`);
  const auto = meta?.auto_label || {};
  if (auto.model_path) pills.push(`modelo: ${shortPath(auto.model_path)}`);
  if (auto.cnn_threshold != null) pills.push(`cnn >= ${formatNumber(auto.cnn_threshold, 3)}`);
  if (auto.cnn_min_epochs != null) pills.push(`min janelas: ${auto.cnn_min_epochs}`);
  if (auto.k_on != null) pills.push(`K_ON ${formatNumber(auto.k_on, 2)}`);
  if (auto.k_off != null) pills.push(`K_OFF ${formatNumber(auto.k_off, 2)}`);
  if (auto.k_off_hold_s != null) pills.push(`K_OFF_HOLD ${formatNumber(auto.k_off_hold_s, 2)}s`);
  if (auto.n_cnn_candidates != null) pills.push(`candidatos CNN: ${auto.n_cnn_candidates}`);
  if (auto.n_confirmed_events != null) pills.push(`confirmados: ${auto.n_confirmed_events}`);
  if (auto.n_discarded_windows != null) pills.push(`descartados: ${auto.n_discarded_windows}`);
  if (meta?.csv_annotations_path) pills.push(`csv: ${shortPath(meta.csv_annotations_path)}`);
  return pills.map(text => `<span class="pill">${escapeHtml(text)}</span>`).join("");
}

function countByDecision(events) {
  const out = {correto: 0, incorreto: 0, pendente: 0};
  for (const ev of events) {
    if (ev.decision === "correto") out.correto += 1;
    else if (ev.decision === "incorreto") out.incorreto += 1;
    else out.pendente += 1;
  }
  return out;
}

function renderQuickStats() {
  const total = state.eventCounts || {};
  const visible = {
    tonic: state.events.filter(ev => ev.type === "tonic").length,
    phasic: state.events.filter(ev => ev.type === "phasic").length,
    any: state.events.filter(ev => ev.type === "any").length,
  };
  const decided = countByDecision(state.allEvents);
  document.getElementById("quickstats").innerHTML = [
    `<span class="pill tonic"><strong>tonic</strong> ${visible.tonic}/${total.tonic ?? 0}</span>`,
    `<span class="pill phasic"><strong>phasic</strong> ${visible.phasic}/${total.phasic ?? 0}</span>`,
    `<span class="pill any"><strong>any</strong> ${visible.any}/${total.any ?? 0}</span>`,
    `<span class="pill"><strong>corretos</strong> ${decided.correto}</span>`,
    `<span class="pill"><strong>incorretos</strong> ${decided.incorreto}</span>`,
    `<span class="pill"><strong>pendentes</strong> ${decided.pendente}</span>`,
  ].join("");
}

function renderList() {
  const list = document.getElementById("evlist");
  const empty = document.getElementById("empty");
  const allDecided = countByDecision(state.allEvents);
  const visibleDecided = countByDecision(state.events);
  document.getElementById("progress").textContent =
    `${state.events.length}/${state.allEvents.length} eventos visiveis · ` +
    `pendentes ${visibleDecided.pendente} (total ${allDecided.pendente})`;

  if (!state.events.length) {
    list.innerHTML = "";
    empty.hidden = false;
    document.getElementById("evpos").textContent = "-";
    return;
  }

  empty.hidden = true;
  list.innerHTML = state.events.map((ev, i) => `
    <div class="evrow ${i === state.idx ? "active" : ""}" data-i="${i}">
      <span>${i + 1}</span>
      <span>
        <span class="lab ${ev.type}">${escapeHtml(ev.type)}</span>
        ${escapeHtml(ev.onset_s)}s (${escapeHtml(ev.duration_s)}s) · ${escapeHtml(ev.stage)}
      </span>
      <span class="dec ${decisionClass(ev.decision)}">${escapeHtml(ev.decision || "pendente")}</span>
    </div>
  `).join("");

  for (const row of list.querySelectorAll(".evrow")) {
    row.onclick = () => showEvent(Number(row.dataset.i));
  }
}

function renderExamMeta(data) {
  document.getElementById("meta").textContent = `${data.n_epochs} mini-epocas · ${data.hours}h`;
  document.getElementById("src").textContent = `fonte: ${data.label_source || "-"}`;
  if (data.view_revision) {
    document.getElementById("viewver").textContent = data.view_revision;
  }
  document.getElementById("labelmeta").innerHTML = buildMetaPills(data.label_metadata || {});
}

function currentFilters() {
  return {
    type: document.getElementById("filter-type").value,
    decision: document.getElementById("filter-decision").value,
  };
}

function applyFilters({focusId = null} = {}) {
  const filters = currentFilters();
  state.events = state.allEvents.filter((ev) => {
    if (filters.type !== "all" && ev.type !== filters.type) return false;
    if (filters.decision === "pendente") return !ev.decision;
    if (filters.decision !== "all" && ev.decision !== filters.decision) return false;
    return true;
  });

  if (!state.events.length) {
    state.idx = 0;
    renderQuickStats();
    renderList();
    drawEmpty("Nenhum evento para os filtros atuais.");
    document.getElementById("evinfo").innerHTML = "Nenhum evento corresponde aos filtros selecionados.";
    return;
  }

  let nextIdx = Math.min(state.idx, state.events.length - 1);
  if (focusId != null) {
    const found = state.events.findIndex(ev => ev.id === focusId);
    if (found >= 0) nextIdx = found;
  }
  state.idx = nextIdx;
  renderQuickStats();
  renderList();
  showEvent(state.idx);
}

function drawEmpty(message) {
  const svg = document.getElementById("trace");
  svg.replaceChildren(
    svgEl("rect", {x: 0, y: 0, width: 1280, height: 360, fill: "#091119"}),
    Object.assign(
      svgEl("text", {x: 24, y: 38, fill: "#8aa0b4", "font-size": 15, "font-family": "sans-serif"}),
      {textContent: message}
    ),
  );
}

async function loadExams() {
  const {exams} = await api("/api/revisao/exams");
  const sel = document.getElementById("exam");
  sel.innerHTML = exams.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");
  sel.onchange = () => loadExam(sel.value);
  if (exams.length) {
    sel.value = exams[0];
    await loadExam(exams[0]);
  } else {
    drawEmpty("Nenhum arquivo .pt encontrado.");
    document.getElementById("evinfo").textContent = "Nenhum exame disponivel.";
  }
}

async function loadExam(name) {
  state.exam = name;
  const data = await api(`/api/revisao/exam?name=${encodeURIComponent(name)}`);
  state.allEvents = data.events || [];
  state.eventCounts = data.event_counts || {};
  state.labelMetadata = data.label_metadata || {};
  state.idx = 0;
  renderExamMeta(data);
  applyFilters();
}

async function showEvent(i) {
  if (!state.events.length) return;
  state.idx = i;
  renderList();

  const ev = state.events[i];
  document.getElementById("evpos").textContent = `${i + 1} / ${state.events.length}`;
  document.getElementById("evinfo").innerHTML =
    `<b>Tipo:</b> ${escapeHtml(ev.type)} · ` +
    `<b>Onset:</b> ${escapeHtml(ev.onset_s)}s · ` +
    `<b>Duracao:</b> ${escapeHtml(ev.duration_s)}s · ` +
    `<b>Estagio:</b> ${escapeHtml(ev.stage)} · ` +
    `<b>Cobertura media:</b> ${escapeHtml(ev.mean_coverage ?? "-")} · ` +
    `<b>Decisao:</b> ${escapeHtml(ev.decision || "pendente")}`;

  const pad = 3.0;
  const t0 = Math.max(0, ev.onset_s - pad);
  const t1 = ev.onset_s + ev.duration_s + pad;
  const token = ++state.requestToken;
  try {
    const sig = await api(`/api/revisao/signal?name=${encodeURIComponent(state.exam)}&t0=${t0}&t1=${t1}`);
    if (token !== state.requestToken) return;
    drawSignal(sig, ev, t0, t1);
  } catch (error) {
    drawEmpty("Falha ao carregar o tracado.");
    document.getElementById("evinfo").innerHTML += ` · <b>Erro:</b> ${escapeHtml(error.message || error)}`;
  }
}

function drawSignal(sig, ev, t0, t1) {
  const svg = document.getElementById("trace");
  const width = 1280;
  const height = 360;
  const nodes = [svgEl("rect", {x: 0, y: 0, width, height, fill: "#091119"})];

  const overlays = [
    {key: "tonic", color: "#4da3ff", cov: sig.tonic_cov || [], mask: sig.tonic_mask || []},
    {key: "phasic", color: "#c77dff", cov: sig.phasic_cov || [], mask: sig.phasic_mask || []},
    {key: "any", color: "#ffb347", cov: sig.any_cov || [], mask: sig.any_mask || []},
  ];
  const laneTop = 14;
  const laneHeight = 20;
  const laneGap = 8;

  overlays.forEach((overlay, idx) => {
    const y = laneTop + idx * (laneHeight + laneGap);
    nodes.push(svgEl("rect", {x: 0, y, width, height: laneHeight, fill: "#111c25", stroke: "#22303d"}));
    const label = svgEl("text", {x: 10, y: y + 14, fill: overlay.color, "font-size": 12, "font-family": "sans-serif"});
    label.textContent = overlay.key;
    nodes.push(label);

    const nEpochs = Math.max(overlay.cov.length, overlay.mask.length);
    if (!nEpochs) return;
    const pxPerEpoch = width / nEpochs;
    for (let ei = 0; ei < nEpochs; ei += 1) {
      const cov = Number(overlay.cov[ei] || 0);
      const on = Boolean(overlay.mask[ei]);
      if (!on && cov <= 0) continue;
      const alpha = Math.max(on ? 0.22 : 0.0, Math.min(0.9, 0.12 + cov * 0.62));
      nodes.push(svgEl("rect", {
        x: ei * pxPerEpoch,
        y,
        width: Math.max(1, pxPerEpoch),
        height: laneHeight,
        fill: overlay.color,
        "fill-opacity": alpha,
      }));
    }
  });

  const trace = sig.display_trace || {};
  const columns = Array.isArray(trace.columns) ? trace.columns : [];
  if (!columns.length) {
    const text = svgEl("text", {x: 24, y: height - 30, fill: "#8aa0b4", "font-size": 15, "font-family": "sans-serif"});
    text.textContent = "Janela sem amostras.";
    nodes.push(text);
    svg.replaceChildren(...nodes);
    return;
  }

  const plotTop = laneTop + overlays.length * (laneHeight + laneGap) + 12;
  const plotBottom = height - 28;
  const plotHeight = plotBottom - plotTop;
  const midY = plotTop + plotHeight / 2;
  const remBaselineUv = Number(sig.rem_baseline_uv);
  const remBaseline2xUv = Number(sig.rem_baseline_2x_uv);
  const maxAbs = Math.max(
    1e-9,
    ...columns.flatMap((col) => [Math.abs(Number(col.lo || 0)), Math.abs(Number(col.hi || 0)), Math.abs(Number(col.mean || 0))]),
    Number.isFinite(remBaselineUv) ? Math.abs(remBaselineUv) : 0,
    Number.isFinite(remBaseline2xUv) ? Math.abs(remBaseline2xUv) : 0,
  );
  const scaleY = (plotHeight / 2 - 10) / maxAbs;

  for (let gy = 0; gy <= 4; gy += 1) {
    const y = plotTop + gy * (plotHeight / 4);
    nodes.push(svgEl("line", {x1: 0, y1: y, x2: width, y2: y, stroke: "#183041", "stroke-width": 1}));
  }
  nodes.push(svgEl("line", {x1: 0, y1: midY, x2: width, y2: midY, stroke: "#35566f", "stroke-width": 1}));

  if (Number.isFinite(remBaseline2xUv) && remBaseline2xUv > 0) {
    const yUp2x = midY - remBaseline2xUv * scaleY;
    const yDown2x = midY + remBaseline2xUv * scaleY;
    nodes.push(svgEl("line", {
      x1: 0, y1: yUp2x, x2: width, y2: yUp2x,
      stroke: "#ffd84d", "stroke-width": 1.4, "stroke-dasharray": "8 6", "stroke-opacity": 0.95,
    }));
    nodes.push(svgEl("line", {
      x1: 0, y1: yDown2x, x2: width, y2: yDown2x,
      stroke: "#ffd84d", "stroke-width": 1.4, "stroke-dasharray": "8 6", "stroke-opacity": 0.95,
    }));
    const upLabel = svgEl("text", {
      x: width - 160, y: yUp2x - 6, fill: "#ffd84d", "font-size": 11, "font-family": "sans-serif",
    });
    upLabel.textContent = `+2x basal (${formatNumber(remBaseline2xUv, 2)} uV)`;
    nodes.push(upLabel);
    const downLabel = svgEl("text", {
      x: width - 160, y: yDown2x + 16, fill: "#ffd84d", "font-size": 11, "font-family": "sans-serif",
    });
    downLabel.textContent = `-2x basal`;
    nodes.push(downLabel);
  }

  if (Number.isFinite(remBaselineUv) && remBaselineUv > 0) {
    const yBaseline = midY - remBaselineUv * scaleY;
    nodes.push(svgEl("line", {
      x1: 0, y1: yBaseline, x2: width, y2: yBaseline,
      stroke: "#ff6b6b", "stroke-width": 1.3, "stroke-dasharray": "4 4", "stroke-opacity": 0.95,
    }));
    const baselineLabel = svgEl("text", {
      x: width - 220, y: yBaseline - 6, fill: "#ff9d9d", "font-size": 11, "font-family": "sans-serif",
    });
    baselineLabel.textContent = `basal REM = ${formatNumber(remBaselineUv, 2)} uV`;
    nodes.push(baselineLabel);
  }

  const eventX = ((ev.onset_s - t0) / Math.max(1e-9, (t1 - t0))) * width;
  const eventW = (ev.duration_s / Math.max(1e-9, (t1 - t0))) * width;
  nodes.push(svgEl("rect", {
    x: eventX, y: 0, width: eventW, height,
    fill: "#ffffff", "fill-opacity": 0.06,
    stroke: "#ffffff", "stroke-opacity": 0.4,
  }));

  const colWidth = width / Math.max(1, columns.length);
  const meanPoints = [];
  columns.forEach((col, idx) => {
    const x = idx * colWidth;
    const lo = Number(col.lo || 0);
    const hi = Number(col.hi || 0);
    const mean = Number(col.mean || 0);
    const y1 = midY - hi * scaleY;
    const y2 = midY - lo * scaleY;
    const top = Math.min(y1, y2);
    const barHeight = Math.max(2, Math.abs(y2 - y1));
    nodes.push(svgEl("rect", {
      x,
      y: top,
      width: Math.max(1.5, colWidth * 0.82),
      height: barHeight,
      fill: "#7fd4ff",
      "fill-opacity": 0.45,
      rx: 0.8,
    }));
    nodes.push(svgEl("line", {
      x1: x + colWidth * 0.41,
      y1,
      x2: x + colWidth * 0.41,
      y2,
      stroke: "#7fd4ff",
      "stroke-width": Math.max(1.2, colWidth * 0.22),
      "stroke-opacity": 0.95,
      "stroke-linecap": "round",
    }));
    meanPoints.push(`${x + colWidth * 0.41},${midY - mean * scaleY}`);
  });
  nodes.push(svgEl("polyline", {
    points: meanPoints.join(" "),
    fill: "none",
    stroke: "#d8f4ff",
    "stroke-width": 1.1,
    "stroke-opacity": 0.9,
    "stroke-linejoin": "round",
    "stroke-linecap": "round",
  }));

  const leftText = svgEl("text", {x: 10, y: height - 8, fill: "#8aa0b4", "font-size": 12, "font-family": "sans-serif"});
  leftText.textContent = `${formatNumber(t0, 1)}s`;
  nodes.push(leftText);
  const rightText = svgEl("text", {x: width - 60, y: height - 8, fill: "#8aa0b4", "font-size": 12, "font-family": "sans-serif"});
  rightText.textContent = `${formatNumber(t1, 1)}s`;
  nodes.push(rightText);
  const scaleText = svgEl("text", {x: width - 190, y: plotTop + 14, fill: "#8aa0b4", "font-size": 11, "font-family": "sans-serif"});
  scaleText.textContent = "EMG em uV (centrado na mediana da janela)";
  nodes.push(scaleText);
  svg.replaceChildren(...nodes);
}

async function decide(decision) {
  if (!state.events.length) return;
  const ev = state.events[state.idx];
  await apiPost("/api/revisao/decision", {exam: state.exam, event_id: ev.id, decision});
  const currentId = ev.id;
  ev.decision = decision;
  const globalEv = state.allEvents.find(item => item.id === currentId);
  if (globalEv) globalEv.decision = decision;
  applyFilters({focusId: currentId});
  if (!state.events.length) return;
  const stillHere = state.events.findIndex(item => item.id === currentId);
  if (stillHere >= 0 && state.idx < state.events.length - 1) {
    showEvent(Math.min(state.idx + 1, state.events.length - 1));
  }
}

document.getElementById("btn-correto").onclick = () => decide("correto");
document.getElementById("btn-incorreto").onclick = () => decide("incorreto");
document.getElementById("prev").onclick = () => { if (state.idx > 0) showEvent(state.idx - 1); };
document.getElementById("next").onclick = () => { if (state.idx < state.events.length - 1) showEvent(state.idx + 1); };
document.getElementById("filter-type").onchange = () => applyFilters();
document.getElementById("filter-decision").onchange = () => applyFilters();

document.getElementById("reportbtn").onclick = async () => {
  const rep = await apiPost("/api/revisao/report", {});
  const area = document.getElementById("reportarea");
  const tbl = document.getElementById("acctable");
  tbl.innerHTML =
    "<tr><th>Tipo</th><th>Corretos</th><th>Incorretos</th><th>Sem decisao</th><th>Acuracia</th></tr>" +
    rep.summary.map((row) => `
      <tr>
        <td>${escapeHtml(row.type)}</td>
        <td>${escapeHtml(row.n_correto)}</td>
        <td>${escapeHtml(row.n_incorreto)}</td>
        <td>${escapeHtml(row.n_sem_decisao)}</td>
        <td>${row.acuracia_pct != null ? `${escapeHtml(row.acuracia_pct)}%` : "-"}</td>
      </tr>
    `).join("");
  area.hidden = false;
};

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "c" || e.key === "C") decide("correto");
  if (e.key === "x" || e.key === "X") decide("incorreto");
  if (e.key === "a" || e.key === "A") { if (state.idx > 0) showEvent(state.idx - 1); }
  if (e.key === "d" || e.key === "D") { if (state.idx < state.events.length - 1) showEvent(state.idx + 1); }
});

loadExams();
</script>
